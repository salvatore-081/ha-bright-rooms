[project]
name = "bright-rooms"
version = "0.1.5"
description = "Home Assistant integration: room lights switched by presence and by the ambient light without the room's own lights."
requires-python = ">=3.14"
license = "MIT"

[dependency-groups]
dev = ["pytest-homeassistant-custom-component==0.13.375"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
